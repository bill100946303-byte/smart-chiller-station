openapi: 3.0.3
info:
  title: Chiller BFF API
  version: 1.0.1
  description: |
    Contract for Chiller 2.0 BFF aggregation APIs.
    P0 routes are fully specified for FE/BE integration:
    - dashboard/overview
    - dashboard/trends
    - anomalies/summary
    - anomalies/list
servers:
  - url: http://127.0.0.1:8787
tags:
  - name: Health
  - name: Dashboard
  - name: Anomalies
  - name: Devices
  - name: System
  - name: Configuration
  - name: Recommendations
  - name: Optimize
  - name: Admin Configuration
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealthz
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthzResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/sites/{siteId}/stations:
    get:
      tags: [Admin Configuration]
      summary: List physical station identities registered for a project
      operationId: listAdminStationInstances
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
        - $ref: "#/components/parameters/AdminUserIdHeader"
        - name: publishedOnly
          in: query
          required: false
          description: Return only station identities visible to the runtime shell.
          schema:
            type: boolean
            default: false
        - name: parentSubsystemType
          in: query
          required: false
          description: Optional owning energy-object type filter.
          schema:
            type: string
      responses:
        "200":
          description: Physical station identity list. An empty list is valid and must not be replaced by mock stations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStationInstanceListResponse"
              examples:
                default:
                  summary: Valid empty physical station registry
                  externalValue: ./examples/admin-station-instances.json
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    put:
      tags: [Admin Configuration]
      summary: Create or update physical station identities for a project
      description: |
        Transactional partial upsert. Records omitted from the request are not deleted.
        A published record is immediately visible to the runtime shell; publication does not imply runtime data filtering by stationId.
      operationId: upsertAdminStationInstances
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
        - $ref: "#/components/parameters/AdminUserIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStationInstanceUpsertRequest"
      responses:
        "200":
          description: Updated server-side physical station identity list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStationInstanceListResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /admin/v1/sites/{siteId}/stations/{stationId}/runtime-binding:
    get:
      tags: [Admin Configuration]
      summary: Read draft and currently published runtime binding heads
      operationId: getAdminStationRuntimeBinding
      security: [{ AdminBearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
        - $ref: "#/components/parameters/StationIdPathParam"
        - $ref: "#/components/parameters/AdminUserIdHeader"
      responses:
        "200":
          description: Draft and published versions are returned independently.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStationRuntimeBindingResponse" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
    put:
      tags: [Admin Configuration]
      summary: Save a new immutable runtime-binding draft version
      operationId: saveAdminStationRuntimeBindingDraft
      security: [{ AdminBearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
        - $ref: "#/components/parameters/StationIdPathParam"
        - $ref: "#/components/parameters/AdminUserIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminStationRuntimeBindingDraftRequest" }
      responses:
        "200":
          description: New draft; an existing published head remains active.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStationRuntimeBindingResponse" }
        "400": { $ref: "#/components/responses/BadRequestError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "409": { $ref: "#/components/responses/ConflictError" }

  /admin/v1/sites/{siteId}/stations/{stationId}/runtime-binding/validate:
    post:
      tags: [Admin Configuration]
      summary: Validate the current draft against the real read-only source
      operationId: validateAdminStationRuntimeBinding
      security: [{ AdminBearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
        - $ref: "#/components/parameters/StationIdPathParam"
        - $ref: "#/components/parameters/AdminUserIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminStationRuntimeBindingVersionRequest" }
      responses:
        "200":
          description: Real-source validation passed and evidence was persisted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStationRuntimeBindingResponse" }
        "422":
          description: Validation failed closed; response ok is false.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "409": { $ref: "#/components/responses/ConflictError" }

  /admin/v1/sites/{siteId}/stations/{stationId}/runtime-binding/publish:
    post:
      tags: [Admin Configuration]
      summary: Atomically publish a validated draft binding
      description: Platform-admin only. The publisher must differ from the draft creator/editor.
      operationId: publishAdminStationRuntimeBinding
      security: [{ AdminBearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
        - $ref: "#/components/parameters/StationIdPathParam"
        - $ref: "#/components/parameters/AdminUserIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminStationRuntimeBindingVersionRequest" }
      responses:
        "200":
          description: Head was atomically switched to the published version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStationRuntimeBindingResponse" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "409": { $ref: "#/components/responses/ConflictError" }

  /bff/v1/sites/{siteId}/capabilities:
    get:
      tags: [Configuration]
      summary: Published subsystem capability registry for the current project
      operationId: getSiteCapabilities
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
      responses:
        "200":
          description: Project-wide energy-object capability registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSubsystemCapabilityListResponse"
              examples:
                default:
                  summary: Multi-energy capability registry example
                  externalValue: ./examples/site-capabilities.json
        "503":
          $ref: "#/components/responses/ConfigurationCenterUnavailableError"

  /bff/v1/sites/{siteId}/subsystems:
    get:
      tags: [Configuration]
      summary: Published subsystem registry for the current project
      operationId: getSiteSubsystems
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
      responses:
        "200":
          description: Project-wide energy-object subsystem registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSubsystemCapabilityListResponse"
              examples:
                default:
                  summary: Multi-energy subsystem registry example
                  externalValue: ./examples/site-subsystems.json
        "503":
          $ref: "#/components/responses/ConfigurationCenterUnavailableError"

  /bff/v1/sites/{siteId}/dashboard/overview:
    get:
      tags: [Dashboard]
      summary: Dashboard overview aggregate
      operationId: getDashboardOverview
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
      responses:
        "200":
          description: Dashboard overview payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverviewResponse"
              examples:
                default:
                  summary: P0 dashboard overview example
                  externalValue: ./examples/dashboard-overview.json
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /bff/v1/sites/{siteId}/dashboard/trends:
    get:
      tags: [Dashboard]
      summary: Dashboard trend series aggregate
      operationId: getDashboardTrends
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
        - $ref: "#/components/parameters/RangeQueryParam"
      responses:
        "200":
          description: Dashboard trends payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardTrendsResponse"
              examples:
                default:
                  summary: P0 dashboard trends example
                  externalValue: ./examples/dashboard-trends.json
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /bff/v1/sites/{siteId}/anomalies/summary:
    get:
      tags: [Anomalies]
      summary: Anomaly summary aggregate
      operationId: getAnomaliesSummary
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
      responses:
        "200":
          description: Anomalies summary payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomaliesSummaryResponse"
              examples:
                default:
                  summary: P0 anomalies summary example
                  externalValue: ./examples/anomalies-summary.json
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /bff/v1/sites/{siteId}/anomalies/list:
    get:
      tags: [Anomalies]
      summary: Anomaly list aggregate
      operationId: getAnomaliesList
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
        - name: page
          in: query
          required: false
          description: 1-based page index.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: Number of rows per page.
          schema:
            type: integer
            minimum: 1
            default: 20
        - name: severity
          in: query
          required: false
          description: Severity filter for the final alarm taxonomy.
          schema:
            type: string
            enum: [critical, major, minor, normal]
        - name: state
          in: query
          required: false
          description: Optional legacy alarm state filter.
          schema:
            type: string
      responses:
        "200":
          description: Anomalies list payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomaliesListResponse"
              examples:
                default:
                  summary: Sprint1 anomalies list example
                  externalValue: ./examples/anomalies-list.json
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /bff/v1/sites/{siteId}/system/topology:
    get:
      tags: [System]
      summary: Static system topology aggregate
      operationId: getSystemTopology
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
      responses:
        "200":
          description: System topology payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemTopologyResponse"
              examples:
                default:
                  summary: System topology example
                  externalValue: ./examples/system-topology.json
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /bff/v1/sites/{siteId}/system/diagram:
    get:
      tags: [System]
      summary: System diagram aggregate
      operationId: getSystemDiagram
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
        - $ref: "#/components/parameters/LayoutModeQueryParam"
        - $ref: "#/components/parameters/ScopeQueryParam"
      responses:
        "200":
          description: System diagram payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemDiagramResponse"
              examples:
                default:
                  summary: System diagram example
                  externalValue: ./examples/system-diagram.json
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /bff/v1/sites/{siteId}/devices/list:
    get:
      tags: [Devices]
      summary: Device list aggregate
      operationId: getDevicesList
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
        - name: page
          in: query
          required: false
          description: 1-based page index.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: Number of rows per page.
          schema:
            type: integer
            minimum: 1
            default: 12
        - name: type
          in: query
          required: false
          description: Optional system type filter.
          schema:
            type: string
            enum: [chiller, chilledPump, coolingPump, coolingTower, other]
        - name: floor
          in: query
          required: false
          description: Optional floor filter.
          schema:
            type: string
      responses:
        "200":
          description: Device list payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicesListResponse"
              examples:
                default:
                  summary: Sprint1 devices list example
                  externalValue: ./examples/devices-list.json
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /bff/v1/sites/{siteId}/devices/tree:
    get:
      tags: [Devices]
      summary: Device tree aggregate
      operationId: getDevicesTree
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
        - name: build
          in: query
          required: false
          description: Legacy building selector for tree source.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: floor
          in: query
          required: false
          description: Legacy floor selector for tree source.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Device tree payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicesTreeResponse"
              examples:
                default:
                  summary: Sprint2 devices tree example
                  externalValue: ./examples/devices-tree.json
                degraded:
                  summary: Sprint2 devices tree degraded example
                  externalValue: ./examples/devices-tree-degraded.json
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /bff/v1/sites/{siteId}/runtime/summary:
    get:
      tags: [Devices]
      summary: Read-only runtime point summary with optional physical-station isolation
      description: |
        When stationId is supplied, the BFF requires a published, hash-matched runtime binding,
        applies the exact device and point allowlists, and returns station_binding scope evidence.
        Compressed-air and boiler bindings also return stationProcess metrics derived only from
        explicitly configured point-role mappings. Missing or invalid bindings fail closed.
      operationId: getRuntimePointSummary
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
        - name: stationId
          in: query
          required: false
          description: Stable physical station identifier. Required by station-instance UI routes.
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: Runtime summary. A station request includes verified station_binding dataScope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimePointSummaryResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /bff/v1/sites/{siteId}/devices/{deviceId}:
    get:
      tags: [Devices]
      summary: Device detail aggregate
      operationId: getDeviceDetail
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
        - name: deviceId
          in: path
          required: true
          description: Device identifier from devices/list or devices/tree.
          schema:
            type: string
            minLength: 1
        - name: build
          in: query
          required: false
          description: Legacy building selector for detail tree source.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: floor
          in: query
          required: false
          description: Legacy floor selector for detail tree source.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Device detail payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceDetailResponse"
              examples:
                default:
                  summary: Sprint2 device detail example
                  externalValue: ./examples/device-detail.json
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /bff/v1/sites/{siteId}/recommendations:
    get:
      tags: [Recommendations]
      summary: Recommendation cards aggregate
      operationId: getRecommendations
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
      responses:
        "200":
          description: Recommendations payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationsResponse"
              examples:
                default:
                  summary: Recommendations example
                  externalValue: ./examples/recommendations.json
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /bff/v1/sites/{siteId}/optimize:
    post:
      tags: [Optimize]
      summary: Build tower approach and pump delta-T AI advisor result
      operationId: postOptimizeDraft
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeDraftRequest"
      responses:
        "200":
          description: Tower approach and pump delta-T AI advisor result generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizeAdvisorResponse"
              examples:
                default:
                  summary: Tower approach and pump delta-T AI advisor result example
                  externalValue: ./examples/optimize-advisor-result.json
        "400":
          $ref: "#/components/responses/BadRequestError"
        "500":
          $ref: "#/components/responses/InternalError"

  /bff/v1/sites/{siteId}/optimize/tower-approach/advice:
    post:
      tags: [Optimize]
      summary: Build tower approach AI target advice
      operationId: postTowerApproachAdvice
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeDraftRequest"
      responses:
        "200":
          description: Tower approach AI target advice generated.
          content:
            application/json:
              schema:
                type: object
                required: [ok, code, requestId, advisorResult, towerApproachAdvisor, details]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  code:
                    type: string
                    enum: [OK]
                  requestId:
                    type: string
                  advisorResult:
                    type: object
                    nullable: true
                  towerApproachAdvisor:
                    type: object
                    nullable: true
                  details:
                    $ref: "#/components/schemas/OptimizeDraftDetails"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "500":
          $ref: "#/components/responses/InternalError"

  /bff/v1/sites/{siteId}/optimize/chiller-staging/samples:
    get:
      tags: [Optimize]
      summary: List append-only chiller staging samples
      operationId: listChillerStagingSamples
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
        - name: combinationKey
          in: query
          required: false
          schema:
            type: string
          description: Optional normalized combination key, such as CH4+CH5+CH7.
        - name: combination
          in: query
          required: false
          schema:
            type: string
          description: Optional raw combination text used when combinationKey is omitted.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 100
      responses:
        "200":
          description: Append-only chiller staging sample list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChillerStagingSampleListResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /bff/v1/sites/{siteId}/optimize/executions:
    get:
      tags: [Optimize]
      summary: List governance optimize executions
      operationId: listOptimizeExecutions
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
        - $ref: "#/components/parameters/OptimizeExecutionStatusQueryParam"
        - $ref: "#/components/parameters/OptimizeExecutionLimitQueryParam"
      responses:
        "200":
          description: Governance optimize execution list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizeExecutionListResponse"
              examples:
                default:
                  summary: Optimize execution list example
                  externalValue: ./examples/optimize-executions-list.json
        "400":
          $ref: "#/components/responses/BadRequestError"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Optimize]
      summary: Create governance optimize execution draft
      operationId: createOptimizeExecution
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOptimizeExecutionRequest"
      responses:
        "201":
          description: Governance optimize execution created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizeExecutionMutationResponse"
              examples:
                default:
                  summary: Optimize execution create example
                  externalValue: ./examples/optimize-executions-create.json
        "400":
          $ref: "#/components/responses/BadRequestError"
        "500":
          $ref: "#/components/responses/InternalError"

  /bff/v1/sites/{siteId}/optimize/executions/{executionId}/dispatch:
    post:
      tags: [Optimize]
      summary: Dispatch approved tower approach or pump delta-T execution by configured mode
      operationId: dispatchOptimizeExecution
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
        - $ref: "#/components/parameters/ExecutionIdPathParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Optimize execution dispatch receipt persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizeExecutionMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /bff/v1/sites/{siteId}/optimize/executions/{executionId}/approve:
    post:
      tags: [Optimize]
      summary: Approve governance optimize execution
      operationId: approveOptimizeExecution
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
        - $ref: "#/components/parameters/ExecutionIdPathParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveOptimizeExecutionRequest"
      responses:
        "200":
          description: Governance optimize execution approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizeExecutionMutationResponse"
              examples:
                default:
                  summary: Optimize execution approve example
                  externalValue: ./examples/optimize-executions-approve.json
        "400":
          $ref: "#/components/responses/BadRequestError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalError"

  /bff/v1/sites/{siteId}/optimize/executions/{executionId}/rollback:
    post:
      tags: [Optimize]
      summary: Roll back governance optimize execution
      operationId: rollbackOptimizeExecution
      parameters:
        - $ref: "#/components/parameters/SiteIdPathParam"
        - $ref: "#/components/parameters/ExecutionIdPathParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackOptimizeExecutionRequest"
      responses:
        "200":
          description: Governance optimize execution rolled back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizeExecutionMutationResponse"
              examples:
                default:
                  summary: Optimize execution rollback example
                  externalValue: ./examples/optimize-executions-rollback.json
        "400":
          $ref: "#/components/responses/BadRequestError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    AdminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-token
  parameters:
    SiteIdPathParam:
      name: siteId
      in: path
      required: true
      description: Site identifier, same as legacy dbName, e.g. 126lnoffice.
      schema:
        type: string
        minLength: 1
    StationIdPathParam:
      name: stationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[A-Za-z0-9](?:[A-Za-z0-9._-]{0,62}[A-Za-z0-9])?$"
    AdminUserIdHeader:
      name: x-chiller-user-id
      in: header
      required: false
      description: Explicit admin identity hint used by local and integration authentication modes.
      schema:
        type: string
        minLength: 1
    RangeQueryParam:
      name: range
      in: query
      required: false
      description: Time range key for trends.
      schema:
        type: string
        enum: [24h, 7d, 30d]
        default: 24h
    LayoutModeQueryParam:
      name: layoutMode
      in: query
      required: false
      description: Layout mode for system diagram rendering.
      schema:
        type: string
        enum: [auto, fixed]
        default: auto
    ScopeQueryParam:
      name: scope
      in: query
      required: false
      description: Diagram scope level.
      schema:
        type: string
        enum: [main_loop, full]
        default: full
    OptimizeExecutionStatusQueryParam:
      name: status
      in: query
      required: false
      description: Optional governance execution status filter.
      schema:
        type: string
        enum: [pending_approval, approved, rolled_back]
    OptimizeExecutionLimitQueryParam:
      name: limit
      in: query
      required: false
      description: Maximum number of execution rows to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ExecutionIdPathParam:
      name: executionId
      in: path
      required: true
      description: Governance optimize execution identifier.
      schema:
        type: string
        minLength: 1

  responses:
    UnauthorizedError:
      description: Missing, invalid, or expired admin authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            ok: false
            code: ADMIN_UNAUTHORIZED
            error: "Missing admin user context"
            requestId: "req-20260719-0001"
    BadRequestError:
      description: Invalid request parameter or malformed query.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            ok: false
            code: BAD_REQUEST
            error: "Invalid range value: 90d"
            requestId: "req-20260311-0001"
            details:
              field: range
    NotFoundError:
      description: Site not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            ok: false
            code: NOT_FOUND
            error: "Site not found: missing-site"
            requestId: "req-20260311-0002"
    ForbiddenError:
      description: Caller does not have permission to approve or roll back the execution.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            ok: false
            code: ADMIN_FORBIDDEN
            error: "仅平台/站点管理员可审批或回退"
            requestId: "req-20260408-0001"
            details:
              requiredRoles: [platform_admin, site_admin]
              siteId: "btwentyfive"
    ConflictError:
      description: Execution state-machine conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            ok: false
            code: CONFLICT
            error: "Execution must be approved before rollback"
            requestId: "req-20260408-0002"
    NotImplementedDraft:
      description: Optimize draft endpoint returns governance draft details in a 501 envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OptimizeDraftNotImplementedResponse"
          example:
            ok: false
            code: NOT_IMPLEMENTED
            error: "Optimize engine is not implemented yet; returning a context-backed draft"
            requestId: "req-20260408-0003"
    UpstreamError:
      description: Upstream legacy endpoint failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            ok: false
            code: UPSTREAM_ERROR
            error: "Legacy request failed"
            requestId: "req-20260311-0003"
            sourceStatus:
              overall: failed
              sources:
                - key: energy
                  endpoint: "/zsqy/homepage/126lnoffice/getEnergyStatisticsCurve"
                  ok: false
                  status: 500
                  message: null
                  error: "Legacy request failed: 500"
                  rows: null
    InternalError:
      description: BFF internal unhandled error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            ok: false
            code: INTERNAL_ERROR
            error: "Unhandled error"
            requestId: "req-20260311-0004"
    ConfigurationCenterUnavailableError:
      description: Published energy-object configuration is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            ok: false
            code: CONFIG_CENTER_UNAVAILABLE
            error: "Configuration center store is unavailable"
            requestId: "req-20260719-0001"

  schemas:
    HealthzResponse:
      type: object
      required: [ok, service, port, legacyBaseUrl]
      properties:
        ok:
          type: boolean
        service:
          type: string
        port:
          type: integer
        legacyBaseUrl:
          type: string

    SiteRef:
      type: object
      required: [siteId, siteName]
      properties:
        siteId:
          type: string
        siteName:
          type: string

    Freshness:
      type: object
      description: Unified freshness metadata for all aggregation payloads.
      required: [latestTimestamp, stale, ageHours]
      properties:
        latestTimestamp:
          type: string
          format: date-time
          nullable: true
        stale:
          type: boolean
        ageHours:
          type: number
          format: double
          nullable: true

    SourceEndpointStatus:
      type: object
      required: [key, endpoint, ok, status, message, error, rows]
      properties:
        key:
          type: string
          description: Stable source key used by the BFF contract. Frontend should map localized text by key first (not by message). For metric-level recommendation sources, key must be metric.<snake_case> (for example metric.station_total_power_kw). For non-metric sources, use stable adapter keys such as energyCurve/latestAlarmLog/ruleMetrics. If client receives non-contract payload with missing key, fallback to endpoint only as a temporary UI label and report contract drift.
          pattern: "^(metric\\.[a-z0-9_]+|[A-Za-z][A-Za-z0-9._-]*)$"
          example: metric.station_total_power_kw
        endpoint:
          type: string
        ok:
          type: boolean
        status:
          type: integer
          nullable: true
          description: Upstream HTTP status when available. Use null when upstream is unreachable or no HTTP status is available (for example timeout/network/parser failure). When value is >=500, treat as upstream service failure.
        message:
          type: string
          nullable: true
          description: Optional non-localized adapter detail. Frontend should treat this as secondary detail and avoid direct rendering as the primary localized text.
        error:
          type: string
          nullable: true
        rows:
          type: integer
          nullable: true

    SourceStatus:
      type: object
      description: Unified source status for all aggregation payloads.
      required: [overall, sources]
      properties:
        overall:
          type: string
          enum: [ok, partial, failed]
        sources:
          type: array
          minItems: 0
          description: Per-source status list. Empty array means no upstream source participated for this payload.
          items:
            $ref: "#/components/schemas/SourceEndpointStatus"

    RuntimeDataScope:
      type: object
      description: Scope actually enforced by the endpoint. Navigation query context alone never sets applied=true.
      required:
        - siteId
        - requestedSubsystemType
        - effectiveSubsystemType
        - stationId
        - filterMode
        - applied
        - reason
      properties:
        siteId:
          type: string
        requestedSubsystemType:
          type: string
          nullable: true
        effectiveSubsystemType:
          type: string
          nullable: true
        stationId:
          type: string
          nullable: true
        filterMode:
          type: string
          enum: [fixed_subsystem, site_aggregate, project_unfiltered, device_selected, station_binding]
        applied:
          type: boolean
        reason:
          type: string
          enum: [ENDPOINT_FIXED_SCOPE, SUBSYSTEM_FILTER_NOT_IMPLEMENTED, DEVICE_SELECTOR_APPLIED, STATION_RUNTIME_BINDING_APPLIED, SITE_AGGREGATE, MIXED_SCOPE_PAYLOAD]
        bindingVersion:
          type: integer
          minimum: 1
          nullable: true

    StationProcessRoleMeasurement:
      type: object
      required: [role, label, required, value, matched, authoritativeTimestamp]
      properties:
        mappingId: { type: string, nullable: true }
        role: { type: string }
        label: { type: string }
        pointCode: { type: string, nullable: true }
        required: { type: boolean }
        value:
          nullable: true
          oneOf:
            - { type: number }
            - { type: string }
            - { type: boolean }
        unit: { type: string, nullable: true }
        qualityCode: { type: string }
        observedAt: { type: string, format: date-time, nullable: true }
        authoritativeTimestamp: { type: boolean }
        deviceId: { type: string, nullable: true }
        deviceCode: { type: string, nullable: true }
        sourcePointKey: { type: string, nullable: true }
        matched: { type: boolean }

    StationProcessSummary:
      type: object
      required: [contractVersion, station, readiness, timestampStatus, coverage, missingRequiredRoles, roleMeasurements, operatingState, metrics]
      properties:
        contractVersion:
          type: string
          enum: [station-process-summary-v1]
        station:
          type: object
          required: [siteId, stationId, stationName, subsystemType, bindingVersion]
          properties:
            siteId: { type: string }
            stationId: { type: string }
            stationName: { type: string }
            subsystemType: { type: string, enum: [compressed_air, boiler_room] }
            bindingVersion: { type: integer, minimum: 1 }
        readiness:
          type: string
          enum: [ready, partial, blocked]
        timestampStatus:
          type: string
          enum: [authoritative, partial, unverified, unavailable]
        coverage:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        missingRequiredRoles:
          type: array
          items: { type: string }
        roleMeasurements:
          type: array
          items:
            $ref: "#/components/schemas/StationProcessRoleMeasurement"
        operatingState:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        metrics:
          type: object
          description: Normalized read-only metrics for compressedAir or boilerRoom; unavailable values are null.
          additionalProperties: true

    RuntimePointSummaryResponse:
      type: object
      required: [site, generatedAt, status, counts, pointEvidence, sourceStatus]
      properties:
        site:
          $ref: "#/components/schemas/SiteRef"
        generatedAt:
          type: string
          format: date-time
        status:
          type: string
        basis:
          type: string
        counts:
          type: object
          additionalProperties: true
        keySignals:
          type: object
          additionalProperties: true
        pointEvidence:
          type: object
          additionalProperties: true
        stationProcess:
          $ref: "#/components/schemas/StationProcessSummary"
        sourceStatus:
          $ref: "#/components/schemas/SourceStatus"
        dataScope:
          $ref: "#/components/schemas/RuntimeDataScope"

    RuntimeFieldScope:
      type: object
      required: [fieldPaths, exclusions, dataScope]
      properties:
        fieldPaths:
          type: array
          items:
            type: string
        exclusions:
          type: array
          items:
            type: string
        dataScope:
          $ref: "#/components/schemas/RuntimeDataScope"

    DashboardOverviewFieldScopes:
      type: object
      required: [chilledPlantMetrics, projectAggregate]
      properties:
        chilledPlantMetrics:
          $ref: "#/components/schemas/RuntimeFieldScope"
        projectAggregate:
          $ref: "#/components/schemas/RuntimeFieldScope"

    RuntimeControlBoundary:
      type: object
      properties:
        mode:
          type: string
          enum: [read_only, shadow, assisted, enforced]
        approvalRequired:
          type: boolean
        plcProtectionRequired:
          type: boolean
        rollbackRequired:
          type: boolean
        writeEnabled:
          type: boolean
        notes:
          type: string
          nullable: true

    RuntimeSubsystemRegistryPointRole:
      type: object
      required: [role, label]
      properties:
        role:
          type: string
        label:
          type: string
        required:
          type: boolean
        unit:
          type: string
          nullable: true

    RuntimeAdvisorBinding:
      type: object
      properties:
        pluginKey:
          type: string
        status:
          type: string
        mode:
          type: string

    RuntimeStationInstance:
      type: object
      description: Physical station identity. Runtime health stays unknown until actual response evidence exists; published binding is not itself live evidence.
      required:
        [siteId, stationId, stationName, parentSubsystemType, status, enabled, sourceStatus, freshnessStatus, alarmCount, bindingState, bindingVersion, draftBindingVersion, publishedBindingVersion, sortOrder, published]
      properties:
        siteId:
          type: string
        stationId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9](?:[A-Za-z0-9._-]{0,62}[A-Za-z0-9])?$"
          description: Stable identifier within the project; must not be derived from a mutable display name.
        stationName:
          type: string
          minLength: 1
        parentSubsystemType:
          type: string
          minLength: 1
          description: Energy-object type that owns this physical station instance.
        status:
          type: string
          enum: [enabled, not_configured, not_applicable]
        enabled:
          type: boolean
        sourceStatus:
          type: string
          nullable: true
        freshnessStatus:
          type: string
          nullable: true
        alarmCount:
          type: integer
          nullable: true
        bindingState:
          type: string
          enum: [unconfigured, draft, validated, published, superseded]
          description: Published head takes precedence while a newer draft coexists.
        bindingVersion:
          type: integer
          nullable: true
        draftBindingVersion:
          type: integer
          nullable: true
        publishedBindingVersion:
          type: integer
          nullable: true
        sortOrder:
          type: integer
          minimum: 0
        published:
          type: boolean
        notes:
          type: string
          nullable: true

    AdminStationInstanceUpsertItem:
      type: object
      additionalProperties: false
      required: [stationId, stationName, parentSubsystemType]
      properties:
        stationId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9](?:[A-Za-z0-9._-]{0,62}[A-Za-z0-9])?$"
          description: Stable identifier; immutable in the management UI after first save.
        stationName:
          type: string
          minLength: 1
        parentSubsystemType:
          type: string
          minLength: 1
        status:
          type: string
          enum: [enabled, not_configured, not_applicable]
          default: not_configured
        sortOrder:
          type: integer
          minimum: 0
          default: 999
        published:
          type: boolean
          default: false
        notes:
          type: string
          nullable: true

    AdminStationInstanceUpsertRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AdminStationInstanceUpsertItem"

    AdminStationInstanceListResponse:
      type: object
      required: [ok, requestId, siteId, generatedAt, items, total]
      properties:
        ok:
          type: boolean
          enum: [true]
        requestId:
          type: string
        siteId:
          type: string
        generatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeStationInstance"
        total:
          type: integer
          minimum: 0

    AdminStationRuntimeBindingSource:
      type: object
      additionalProperties: false
      properties:
        databaseKey: { type: string, nullable: true }
        projectKey: { type: string, nullable: true }
        template: { type: string, nullable: true }

    AdminStationRuntimeBindingSelectors:
      type: object
      additionalProperties: false
      required: [deviceIds]
      properties:
        deviceIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1 }
        deviceCodes:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
        pointCodes:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }

    AdminStationRuntimeBinding:
      type: object
      required: [siteId, stationId, status, bindingVersion, source, selectors, payloadHash]
      properties:
        siteId: { type: string }
        stationId: { type: string }
        stationName: { type: string, nullable: true }
        parentSubsystemType: { type: string, nullable: true }
        status:
          type: string
          enum: [draft, validated, published, superseded, disabled]
        bindingVersion: { type: integer, minimum: 1 }
        source: { $ref: "#/components/schemas/AdminStationRuntimeBindingSource" }
        selectors: { $ref: "#/components/schemas/AdminStationRuntimeBindingSelectors" }
        payloadHash: { type: string }
        validatedHash: { type: string, nullable: true }
        validation:
          type: object
          nullable: true
          additionalProperties: true
        checkedAt: { type: string, format: date-time, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        publishedBy: { type: string, nullable: true }
        notes: { type: string, nullable: true }

    AdminStationRuntimeBindingDraftRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, source, selectors]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        source: { $ref: "#/components/schemas/AdminStationRuntimeBindingSource" }
        selectors: { $ref: "#/components/schemas/AdminStationRuntimeBindingSelectors" }
        notes: { type: string, nullable: true }

    AdminStationRuntimeBindingVersionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }

    AdminStationRuntimeBindingResponse:
      type: object
      required: [ok, requestId, siteId, stationId, draftVersion, publishedVersion]
      properties:
        ok: { type: boolean, enum: [true] }
        requestId: { type: string }
        siteId: { type: string }
        stationId: { type: string }
        binding:
          allOf: [{ $ref: "#/components/schemas/AdminStationRuntimeBinding" }]
          nullable: true
        draftBinding:
          allOf: [{ $ref: "#/components/schemas/AdminStationRuntimeBinding" }]
          nullable: true
        publishedBinding:
          allOf: [{ $ref: "#/components/schemas/AdminStationRuntimeBinding" }]
          nullable: true
        draftVersion: { type: integer, nullable: true }
        publishedVersion: { type: integer, nullable: true }
        configured: { type: boolean }
        validation:
          type: object
          nullable: true
          additionalProperties: true

    RuntimeSubsystemCapability:
      type: object
      required: [subsystemType, displayName, status]
      properties:
        siteId:
          type: string
        subsystemType:
          type: string
          example: chilled_plant
        displayName:
          type: string
          example: 冷冻站
        category:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [enabled, not_configured, not_applicable]
        mode:
          type: string
          nullable: true
        reserved:
          type: boolean
        enabled:
          type: boolean
        kpis:
          type: array
          items:
            type: object
            additionalProperties: true
        alarmCount:
          type: integer
          nullable: true
        freshnessStatus:
          type: string
          nullable: true
        sourceStatus:
          type: string
          nullable: true
        pointMappingProgress:
          type: number
          format: double
          nullable: true
        advisorPluginStatus:
          type: string
          nullable: true
        pageTemplateStatus:
          type: string
          nullable: true
        published:
          type: boolean
        notes:
          type: string
          nullable: true
        requiredPointRoles:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeSubsystemRegistryPointRole"
        advisorBindings:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeAdvisorBinding"
        controlBoundary:
          $ref: "#/components/schemas/RuntimeControlBoundary"

    RuntimeSubsystemCapabilityListResponse:
      type: object
      description: Published project-wide energy-object registry. dataScope is site_aggregate and never implies a physical station instance filter.
      required: [site, generatedAt, kind, items, total, stationInstances, stationTotal, dataScope, freshness, sourceStatus]
      properties:
        site:
          $ref: "#/components/schemas/SiteRef"
        generatedAt:
          type: string
          format: date-time
        kind:
          type: string
          enum: [capabilities, subsystems]
        items:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeSubsystemCapability"
        total:
          type: integer
          minimum: 0
        stationInstances:
          type: array
          description: Physical station identities grouped by parentSubsystemType. This list is registry data, not runtime filter evidence.
          items:
            $ref: "#/components/schemas/RuntimeStationInstance"
        stationTotal:
          type: integer
          minimum: 0
        dataScope:
          $ref: "#/components/schemas/RuntimeDataScope"
        freshness:
          $ref: "#/components/schemas/Freshness"
        sourceStatus:
          $ref: "#/components/schemas/SourceStatus"

    ErrorResponse:
      type: object
      required: [ok, code, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        code:
          type: string
          enum: [BAD_REQUEST, NOT_FOUND, UPSTREAM_ERROR, INTERNAL_ERROR, ADMIN_FORBIDDEN, CONFLICT, NOT_IMPLEMENTED, CONFIG_CENTER_UNAVAILABLE]
        error:
          type: string
        requestId:
          type: string
          nullable: true
        details:
          type: object
          nullable: true
          additionalProperties: true
        freshness:
          allOf:
            - $ref: "#/components/schemas/Freshness"
          nullable: true
        sourceStatus:
          allOf:
            - $ref: "#/components/schemas/SourceStatus"
          nullable: true

    OverviewEnergyCards:
      type: object
      required:
        - currentCop
        - totalPowerKw
        - currentLoadRate
        - totalElectricityKwh
        - savingPotentialPct
        - totalCoolingCapacity
        - activeAnomalyCount
        - chilledDeltaT
        - coolingDeltaT
        - chillerPowerKw
        - chilledPumpPowerKw
        - coolingPumpPowerKw
        - coolingTowerPowerKw
        - chillerCop
        - chilledPumpConveyingCoefficient
        - coolingTowerConveyingCoefficient
        - coolingPumpConveyingCoefficient
        - thermalUnbalanceRate
        - chilledSupplyTemp
        - coolingReturnTemp
        - outdoorTempC
