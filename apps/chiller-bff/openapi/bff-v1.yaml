              type: number
              format: double
              nullable: true
            targetApproachC:
              type: number
              format: double
              nullable: true
            targetTcwsC:
              type: number
              format: double
              nullable: true
            targetChwpFreqTrimHz:
              type: number
              format: double
              nullable: true
              minimum: -5
              maximum: 3
            targetCwpFreqTrimHz:
              type: number
              format: double
              nullable: true
              minimum: -5
              maximum: 3
            ttlSeconds:
              type: integer
              nullable: true
