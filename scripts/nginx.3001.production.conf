# Fixed production entry for the local chiller shell.
# This is intentionally separate from nginx.scene.local.conf (port 4000).
worker_processes  1;
pid /Users/billchow/Documents/智慧冷冻站/apps/chiller-shell-v1/.logs/nginx-3001.pid;

events {
    worker_connections 1024;
}

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /Users/billchow/Documents/智慧冷冻站/apps/chiller-shell-v1/.logs/nginx-3001.access.log;
    error_log /Users/billchow/Documents/智慧冷冻站/apps/chiller-shell-v1/.logs/nginx-3001.error.log warn;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 127.0.0.1:3001;
        server_name 127.0.0.1 localhost;
        root /Users/billchow/Documents/智慧冷冻站/apps/chiller-shell-v1/dist;
        index index.html;

        # This confirms that the fixed 3001 entry is answering HTTP requests.
        location = /health {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 200 '{"service":"chiller-shell-3001","status":"ok"}\n';
        }

        # Preserve frontend-to-BFF calls without exposing the BFF on the UI URL.
        location /bff/ {
            proxy_pass http://127.0.0.1:8787;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /admin/ {
            proxy_pass http://127.0.0.1:8787;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # React client-side routes, including /hvac-terminal, must resolve to the shell.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
